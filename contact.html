<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Start a conversation with Mangobyte Digital about your next project.">
    <title>Contact Us | Mangobyte Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body class="contact-page">
    <div class="noise"></div>
    <div class="custom-cursor" id="cursor"></div>
    <header class="site-header" id="navbar">
        <div class="container">
            <a class="header-logo" href="index.html" aria-label="Mangobyte home"><img src="logo-color.png" alt="Mangobyte"></a>
            <div class="header-right">
                <div class="menu-toggle" id="menu-toggle-btn" role="button" tabindex="0" aria-label="Open menu" aria-expanded="false">
                    <span class="menu-label">Menu</span>
                    <div class="hamburger" aria-hidden="true"><span></span><span></span><span></span></div>
                </div>
            </div>
        </div>
    </header>

    <div class="menu-overlay" id="menu-overlay" aria-hidden="true">
        <nav class="overlay-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#portfolio">Work</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </div>

    <main class="contact-main">
        <section class="contact-intro container" aria-labelledby="contact-title">
            <h1 id="contact-title">Get in Touch with Our Team</h1>
            <p class="contact-lede">Reach out to us, and let’s start building something great together.</p>
        </section>

        <section class="contact-layout container" aria-label="Contact form and office information">
            <div class="contact-form-card">
                <form id="contact-form" class="contact-form">
                    <div class="contact-field">
                        <label for="contact-name">Name</label>
                        <input id="contact-name" name="name" type="text" class="form-input" placeholder="Your full name" autocomplete="name" required>
                    </div>
                    <div class="contact-field">
                        <label for="contact-email">Email Address</label>
                        <input id="contact-email" name="email" type="email" class="form-input" placeholder="We’ll get back to you here" autocomplete="email" required>
                    </div>
                    <div class="contact-field">
                        <label for="contact-company">Company Name</label>
                        <input id="contact-company" name="company" type="text" class="form-input" placeholder="Let us know who you represent" autocomplete="organization">
                    </div>
                    <div class="contact-field">
                        <label for="contact-subject">Subject</label>
                        <input id="contact-subject" name="subject" type="text" class="form-input" placeholder="What’s this about?" required>
                    </div>
                    <div class="contact-field">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" rows="5" class="form-input" placeholder="Tell us how we can help." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary contact-submit">Send Message <i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
                </form>
            </div>

            <aside class="contact-details">
                <div class="contact-direct">
                    <p class="contact-panel-label">Prefer a Direct Approach?</p>
                    <a id="contact-phone-link" href="tel:+61410532359"><i data-lucide="phone" aria-hidden="true"></i><span id="contact-phone">+61 410 532 359</span></a>
                    <a href="mailto:hello@mangobyte.com.np"><i data-lucide="mail" aria-hidden="true"></i><span>hello@mangobyte.com.np</span></a>
                    <div class="contact-location-toggle" role="group" aria-label="Choose office location">
                        <button type="button" class="is-active" data-location="australia" aria-pressed="true">Australia</button>
                        <button type="button" data-location="nepal" aria-pressed="false">Nepal</button>
                    </div>
                </div>

                <div class="contact-map-card">
                    <div class="contact-map-art">
                        <iframe id="contact-map-frame" title="Map showing the Australia office" src="https://www.google.com/maps?q=1%20Seaford%20Street%2C%20Pimpama%2C%20Gold%20Coast%204209&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <site-footer data-root=""></site-footer>

    <script src="shared-footer.js"></script>
    <script src="main.js"></script>
    <script>
        lucide.createIcons();

        const contactLocations = {
            australia: {
                title: 'Australia Office',
                phone: '+61 410 532 359',
                phoneHref: 'tel:+61410532359',
                address: '1 Seaford Street, Pimpama, Gold Coast – 4209',
                directions: 'https://maps.app.goo.gl/7YnEMKpCWruZXSFW9',
                mapEmbed: 'https://www.google.com/maps?q=1%20Seaford%20Street%2C%20Pimpama%2C%20Gold%20Coast%204209&output=embed'
            },
            nepal: {
                title: 'Nepal Office',
                phone: '+977 9863593458',
                phoneHref: 'tel:+9779863593458',
                address: 'Thapathali, Kathmandu, Nepal',
                directions: 'https://maps.app.goo.gl/cUBMkGeNY5SQuxjU9',
                mapEmbed: 'https://www.google.com/maps?q=Thapathali%2C%20Kathmandu%2C%20Nepal&output=embed'
            }
        };

        document.querySelectorAll('.contact-location-toggle button').forEach((button) => {
            button.addEventListener('click', () => {
                const location = contactLocations[button.dataset.location];
                document.querySelectorAll('.contact-location-toggle button').forEach((item) => {
                    const active = item === button;
                    item.classList.toggle('is-active', active);
                    item.setAttribute('aria-pressed', String(active));
                });
                document.getElementById('contact-phone').textContent = location.phone;
                document.getElementById('contact-phone-link').href = location.phoneHref;
                const mapFrame = document.getElementById('contact-map-frame');
                mapFrame.src = location.mapEmbed;
                mapFrame.title = `Map showing the ${location.title}`;
            });
        });
    </script>
</body>
</html>
